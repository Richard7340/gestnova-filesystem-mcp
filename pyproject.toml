[project]
name = "gestnova-filesystem"
version = "0.1.0"
description = "MCP server: per-company VDR filesystem with standardized folder structure + graph-aware navigation"
requires-python = ">=3.11"
dependencies = [
    "mcp>=0.9.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pypdf>=4.0.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[project.scripts]
gestnova-filesystem-mcp = "gestnova_filesystem.server:main"
gestnova-filesystem-http = "gestnova_filesystem.http_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gestnova_filesystem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
